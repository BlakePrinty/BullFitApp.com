<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add exercise - BullFit</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main>
    <h1>Add exercise</h1>
    <p><a th:href="@{${backUrl}}">Back to workout</a></p>

    <form th:action="@{/workouts/{id}/add-exercise(id=${workoutId})}" method="get" class="filters">
        <input type="text" name="q" th:value="${q}" placeholder="Search exercises">
        <select name="muscle">
            <option value="">All muscle groups</option>
            <option th:each="m : ${muscleGroups}" th:value="${m}" th:text="${m.displayName}"
                    th:selected="${m == selectedMuscle}"></option>
        </select>
        <select name="equipment">
            <option value="">All equipment</option>
            <option th:each="e : ${equipmentTypes}" th:value="${e}" th:text="${e.displayName}"
                    th:selected="${e == selectedEquipment}"></option>
        </select>
        <button type="submit">Filter</button>
    </form>

    <table class="exercise-table">
        <tbody>
        <tr th:each="ex : ${exercises}">
            <td>
                <span th:text="${ex.name}"></span>
                <span th:if="${ex.custom}" class="badge">Custom</span><br>
                <span class="muted"
                      th:text="${ex.muscleGroup.displayName} + ' | ' + ${ex.equipment.displayName}"></span>
            </td>
            <td>
                <span th:if="${alreadyAdded.contains(ex.id)}" class="muted">Added</span>
                <form th:unless="${alreadyAdded.contains(ex.id)}"
                      th:action="@{/workouts/{id}/exercises(id=${workoutId})}" method="post">
                    <input type="hidden" name="exerciseId" th:value="${ex.id}">
                    <button type="submit">Add</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(exercises)}" class="muted">No exercises match.</p>
</main>
</body>
</html>
