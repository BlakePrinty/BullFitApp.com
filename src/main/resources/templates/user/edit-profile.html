<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit profile - BullFit</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main>
  <h1>Edit profile</h1>
  <form th:action="@{/settings/profile}" th:object="${form}" method="post">
    <label>First name <input type="text" th:field="*{firstName}"></label>
    <span th:errors="*{firstName}"></span><br>

    <label>Last name <input type="text" th:field="*{lastName}"></label>
    <span th:errors="*{lastName}"></span><br>

    <label>Bio <textarea th:field="*{bio}" rows="3" maxlength="160"
                         placeholder="3x Mr. Olympia, Personal Trainer..."></textarea></label>
    <span th:errors="*{bio}"></span><br>

    <label>Height
      <input type="number" th:field="*{heightFeet}" min="0" max="8" style="width:4rem"> ft
      <input type="number" th:field="*{heightInches}" min="0" max="11" style="width:4rem"> in
    </label><br>

    <label>Weight (lbs) <input type="number" step="0.1" th:field="*{weight}"></label>
    <span th:errors="*{weight}"></span><br>

    <label>Time zone
      <select th:field="*{timeZone}">
        <option th:each="z : ${zones}" th:value="${z}" th:text="${z}"></option>
      </select>
    </label><br>

    <p><a th:href="@{/settings/password}">Change password</a></p>

    <button type="submit">Save</button>
    <a th:href="@{/profile}">Cancel</a>
  </form>
</main>
</body>
</html>
