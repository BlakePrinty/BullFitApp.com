<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Register - BullFit</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main>
  <h1>Create your account</h1>
  <form th:action="@{/register}" th:object="${form}" method="post">
    <label>Username <input type="text" th:field="*{username}"></label>
    <span th:errors="*{username}"></span><br>

    <label>Password <input type="password" th:field="*{password}"></label>
    <span th:errors="*{password}"></span><br>
    <label>Confirm password <input type="password" th:field="*{confirmPassword}"></label>
    <span th:errors="*{confirmPassword}"></span><br>

    <label>Email (optional) <input type="email" th:field="*{email}"></label>
    <span th:errors="*{email}"></span><br>

    <label>First name <input type="text" th:field="*{firstName}"></label><br>
    <label>Last name <input type="text" th:field="*{lastName}"></label><br>
    <label>Height
      <input type="number" th:field="*{heightFeet}" min="0" max="8" style="width:4rem"> ft
      <input type="number" th:field="*{heightInches}" min="0" max="11" style="width:4rem"> in
    </label>
    <span th:errors="*{heightFeet}"></span>
    <span th:errors="*{heightInches}"></span><br>
    <label>Weight <input type="number" step="0.1" th:field="*{weight}"></label><br>
    <label>Birth date <input type="date" th:field="*{birthDate}"></label>
    <span th:errors="*{birthDate}"></span><br>

    <button type="submit">Register</button>
  </form>
</main>
</body>
</html>
