<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New BullSplit - BullFit</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>
  <main>
    <h1>New BullSplit</h1>
    <p class="error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}">
    </p>

    <form th:action="@{/splits/new}" th:object="${form}" method="post">
      <label>Name <input type="text" th:field="*{name}" maxlength="60"></label>
      <span class="error" th:errors="*{name}"></span><br>

      <label>Description (optional)
        <textarea th:field="*{description}" rows="3" maxlength="300"></textarea></label>
      <span class="error" th:errors="*{description}"></span><br>

      <label>Number of days
        <select th:field="*{dayCount}">
          <option th:each="n : ${#numbers.sequence(1, 8)}" th:value="${n}" th:text="${n}"></option>
        </select>
      </label>
      <span class="error" th:errors="*{dayCount}"></span>
      <p class="muted">You can't change this later, but you can rename days and edit their exercises any time.</p>

      <button type="submit" class="primary">Create and add exercises</button>
      <a th:href="@{/splits}">Cancel</a>
    </form>
  </main>
</body>

</html>
