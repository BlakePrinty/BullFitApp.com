<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Swap exercise - BullFit</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main>
    <h1>Swap exercise</h1>
    <p>Replacing <strong th:text="${current.name()}"></strong>
        <span class="muted" th:text="'(' + ${current.equipment().displayName} + ')'"></span></p>
    <p><a th:href="@{/workouts/{id}(id=${workoutId})}">Back to workout</a></p>

    <form th:action="@{/workouts/{id}/exercises/{weId}/swap(id=${workoutId},weId=${current.id()})}"
          method="get" class="filters">
        <input type="text" name="q" th:value="${q}" placeholder="Search exercises">
        <select name="muscle">
            <option value="">All muscle groups</option>
            <option th:each="m : ${muscleGroups}" th:value="${m}" th:text="${m.displayName}"
                    th:selected="${m == selectedMuscle}"></option>
        </select>
        <select name="equipment">
            <option value="">All equipment</option>
            <option th:each="e : ${equipmentTypes}" th:value="${e}" th:text="${e.displayName}"
                    th:selected="${e == selectedEquipment}"></option>
        </select>
        <button type="submit">Filter</button>
    </form>
    <p class="muted">Different equipment is listed first.</p>

    <form th:action="@{/workouts/{id}/exercises/{weId}/swap(id=${workoutId},weId=${current.id()})}"
          method="post">
        <div class="we-card">
            <label><input type="radio" name="scope" value="workout" checked> Just this workout</label><br>
            <label th:if="${current.fromSplit()}">
                <input type="radio" name="scope" value="split"> For the rest of this split
            </label>
        </div>

        <table class="exercise-table">
            <tbody>
            <tr th:each="ex : ${exercises}">
                <td>
                    <span th:text="${ex.name}"></span>
                    <span th:if="${ex.custom}" class="badge">Custom</span><br>
                    <span class="muted"
                          th:text="${ex.muscleGroup.displayName} + ' | ' + ${ex.equipment.displayName}"></span>
                </td>
                <td>
                    <button type="submit" name="exerciseId" th:value="${ex.id}">Swap to this</button>
                </td>
            </tr>
            </tbody>
        </table>
    </form>
    <p class="muted" th:if="${#lists.isEmpty(exercises)}">No matches. Try a different filter.</p>
</main>
</body>
</html>
