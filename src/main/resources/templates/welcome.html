<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome - BullFit</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main>
    <h1>Welcome to BullFit</h1>

    <div th:if="${justRegistered}">
        <p>Your account has been created. Thank you for signing up!</p>
    </div>
    <div th:unless="${justRegistered}" sec:authorize="isAuthenticated()">
        <p>Welcome back, <span th:text="${currentUser.username}"></span>.</p>
    </div>

    <p>BullFit is still being built, and we look forward to you being able to use the site once it launches.
        Your account is ready and waiting.</p>

    <p><a th:href="@{/}">Back to the home page</a></p>
</main>
</body>
</html>
